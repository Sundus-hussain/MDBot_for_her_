
<!-- PHOTO GALLERY -->
<section class="section gallery-section" id="gallery">
  <div class="wrap">
    <div class="head reveal">
      <p class="eyebrow eyebrow--dark">Photo gallery</p>
      <h2>Moments from technology, teaching and community.</h2>
      <p>A few moments from my work as an engineer, educator and speaker.</p>
    </div>

    <div class="gallery" aria-label="Moving photo gallery">
      <div class="gallery__viewport">
        <div class="gallery__track">

          <!-- ORIGINAL SIX PHOTOS -->
          <div class="gallery__group">

            <figure class="gallery__item">
              <button class="gallery__open" type="button"
                aria-label="Enlarge photo: Speaking and conferences">
                <img src="im2.png" alt="Sundus at a speaking or conference event" loading="lazy">
              </button>
              <figcaption>Speaking &amp; conferences</figcaption>
            </figure>

            <figure class="gallery__item">
              <button class="gallery__open" type="button"
                aria-label="Enlarge photo: AWS and cloud technology">
                <img src="img6.png" alt="Sundus at an AWS or cloud technology event" loading="lazy">
              </button>
              <figcaption>AWS &amp; cloud technology</figcaption>
            </figure>

            <figure class="gallery__item">
              <button class="gallery__open" type="button"
                aria-label="Enlarge photo: AI and innovation">
                <img src="im3.jpeg" alt="Sundus presenting or discussing AI and innovation" loading="lazy">
              </button>
              <figcaption>AI &amp; innovation</figcaption>
            </figure>

            <figure class="gallery__item">
              <button class="gallery__open" type="button"
                aria-label="Enlarge photo: Press and release">
                <img src="im4.webp" alt="Sundus featured in press coverage" loading="lazy">
              </button>
              <figcaption>Press &amp; release</figcaption>
            </figure>

            <figure class="gallery__item">
              <button class="gallery__open" type="button"
                aria-label="Enlarge photo: MDBot for Her podcast">
                <img src="img5.webp" alt="MDBot for Her podcast" loading="lazy">
              </button>
              <figcaption>Podcast MDBot for Her</figcaption>
            </figure>

            <figure class="gallery__item">
              <button class="gallery__open" type="button"
                aria-label="Enlarge photo: Awards and achievements">
                <img src="im1.jpeg" alt="Sundus at an awards or achievement event" loading="lazy">
              </button>
              <figcaption>Awards &amp; Achievement</figcaption>
            </figure>

          </div>

          <!-- DUPLICATE SIX PHOTOS FOR SEAMLESS LOOP -->
          <div class="gallery__group" aria-hidden="true" inert>

            <figure class="gallery__item">
              <img src="im2.png" alt="" loading="lazy">
              <figcaption>Speaking &amp; conferences</figcaption>
            </figure>

            <figure class="gallery__item">
              <img src="img6.png" alt="" loading="lazy">
              <figcaption>AWS &amp; cloud technology</figcaption>
            </figure>

            <figure class="gallery__item">
              <img src="im3.jpeg" alt="" loading="lazy">
              <figcaption>AI &amp; innovation</figcaption>
            </figure>

            <figure class="gallery__item">
              <img src="im4.webp" alt="" loading="lazy">
              <figcaption>Press &amp; release</figcaption>
            </figure>

            <figure class="gallery__item">
              <img src="img5.webp" alt="" loading="lazy">
              <figcaption>Podcast MDBot for Her</figcaption>
            </figure>

            <figure class="gallery__item">
              <img src="im1.jpeg" alt="" loading="lazy">
              <figcaption>Awards &amp; Achievement</figcaption>
            </figure>

          </div>
        </div>
      </div>

      <p class="gallery__hint">
        Hover to pause · Select a photo to view it larger
      </p>
    </div>
  </div>
</section>

<!-- ENLARGED PHOTO DIALOG -->
<dialog class="gallery__dialog" id="galleryDialog"
  aria-label="Enlarged gallery photo">
  <button class="gallery__close" type="button"
    aria-label="Close enlarged photo">×</button>
  <img id="galleryDialogImage" src="" alt="">
  <p id="galleryDialogCaption"></p>
</dialog>
